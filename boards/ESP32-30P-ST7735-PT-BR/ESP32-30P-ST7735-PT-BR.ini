; PlatformIO Project Configuration File
; ESP32 30 pinos com ST7735 128x160 + PN532 + NRF24 + CC1101 + GPS + IR + Joystick + Encoder
; Interface em Português (Brasil)

[env:ESP32-30P-ST7735-PT-BR]
board = esp32doit-devkit-v1
board_build.partitions = custom_4Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ESP32-30P-ST7735-PT-BR>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-30P-ST7735-PT-BR
	-DBOARD_NAME=\"ESP32-30P-ST7735-PT-BR\"
	-DLANGUAGE_PT_BR=1
	-DHAS_ENCODER_JY050=1
	-DENCODER_CLK=32
	-DENCODER_DT=33
	-DENCODER_SW=34
	-DENCODER_UP=35
	-DENCODER_DOWN=36
	-DHAS_JOYSTICK=1
	-DJOYSTICK_X=39
	-DJOYSTICK_Y=36
	-DHAS_TOUCH=1
	-DHAS_SCREEN=1
	-DROTATION=1
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_RGB_ORDER=1
	-DTFT_BL=2
	-DTFT_RST=4
	-DTFT_DC=15
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTOUCH_CS=19
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DSDCARD_CS=25
	-DSDCARD_SCK=18
	-DSDCARD_MISO=12
	-DSDCARD_MOSI=23
	-DGROVE_SDA=21
	-DGROVE_SCL=22
	-DUSE_PN532=1
	-DUSE_NRF24_VIA_SPI=1
	-DNRF24_CE_PIN=26
	-DNRF24_SS_PIN=27
	-DUSE_CC1101_VIA_SPI=1
	-DCC1101_GDO0_PIN=13
	-DCC1101_SS_PIN=14
	-DMINBRIGHT=160

lib_deps =
	${env.lib_deps}
