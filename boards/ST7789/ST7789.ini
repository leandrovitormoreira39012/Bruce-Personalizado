[env:ST7789]
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
board_upload.maximum_size = 16777216

build_src_filter = +<src/*> +<../boards/ST7789/*>

build_flags =
    ${env.build_flags}
    -Iboards/ST7789
    -DUSB_as_HID=1
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DREDRAW_DELAY=1
    -DALLOW_ALL_GPIO_FOR_IR_RF=1
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; Board Identification
    -DST7789
    -DDEVICE_NAME='"Marauder Pro 2.8"'

    ; ---------------------
    ;        I2C (PN532)
    ; ---------------------
    -DGROVE_SDA=27
    -DGROVE_SCL=22

    ; ---------------------
    ;     Infravermelho
    ; ---------------------
    -DTXLED=39
    -DRXLED=40
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; ---------------------
    ;       SD Card (Fora da faixa 35-42!)
    ; ---------------------
    -DSDCARD_CS=5
    -DSDCARD_SCK=18
    -DSDCARD_MISO=13
    -DSDCARD_MOSI=11

    ; ---------------------
    ;       Display 2.8" ILI9341
    ; ---------------------
    -DILI9341_2_DRIVER=1
    -DSMOOTH_FONT=1
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=17
    -DTFT_DC=16
    -DTFT_RST=15
    -DTFT_MOSI=11
    -DTFT_SCLK=18
    -DTFT_MISO=13
    -DTFT_BL=7
    -DTFT_BACKLIGHT_ON=HIGH
    -DFP=1
    -DFM=2
    -DFG=3
    -DTFT_SPI_PORT=HSPI

    -DHAS_SCREEN=1
    -DROTATION=3
    -DMINBRIGHT=160
    -DHAS_TOUCH=1
    -DTFT_TOUCH_CS=6
    -DTFT_TOUCH_IRQ=3

    ; ---------------------
    ;       Botões e Joystick JY50
    ; ---------------------
    -DHAS_BTN=1
    -DBTN_ALIAS='"Boot"'
    -DBTN_PIN=0
    -DBTN_ACT=LOW

    -DJOY_UP=8
    -DJOY_DOWN=9
    -DJOY_LEFT=14
    -DJOY_RIGHT=12
    -DJOY_CLICK=46
    -DSEL_BTN=0

    ; ---------------------
    ;       CC1101 & NRF24L01 (SPI Compartilhado)
    ; ---------------------
    -DUSE_CC1101_VIA_SPI=1
    -DCC1101_SS_PIN=10
    -DCC1101_CE_PIN=2

    -DUSE_NRF24_VIA_SPI=1
    -DNRF24_SS_PIN=10
    -DNRF24_CE_PIN=1

    ; ---------------------
    ;           SPI Principal
    ; ---------------------
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

    ; ---------------------
    ;      Bateria (ADC1 Seguro)
    ; ---------------------
    -DBAT_PIN=4

lib_deps = ${env.lib_deps}
