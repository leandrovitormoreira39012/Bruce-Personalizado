; Ambiente 02 - ESP32 S3N16R8 + Display 2.8" ST7789V 240x320 (SPI + Touch)
[env:ambiente-02]
extends = env
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ambiente-02/>

lib_ignore =
    ESP8266Audio
    ESP8266SAM
    ESP32-audioI2S
    FastLED
   
build_flags =
    ${env.build_flags}
    -Iboards/ambiente-02
    -DDEVICE_NAME="\"Marauder-Full-ST7789-S3\""
    -DBOARD_HAS_PSRAM
   
    -DUSER_SETUP_LOADED=1
    -DSMOOTH_FONT=1

    -DST7789_DRIVER=1
    -DCGRAM_OFFSET=1

    ; SPI (shared) - Pinos seguros no S3 (Livre de conflito USB/GPIO 19)
    -DSCK=12
    -DMOSI=11
    -DMISO=10
    -DSS=5
    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=10
    -DSPI_SS_PIN=5

    ; I2C (Wire)
    -DSDA=8
    -DSCL=9

    ; BadUSB Serial Pins
    -DBAD_RX=44
    -DBAD_TX=43

    ; Display TFT 2.8" ST7789 240x320
    -DHAS_SCREEN=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DDTFT_MISO=SPI_MISO_PIN
    -DDTFT_MOSI=SPI_MOSI_PIN
    -DDTFT_SCK=SPI_SCK_PIN
    -DDTFT_CS=17
    -DDTFT_DC=16
    -DDTFT_RST=15
    -DDTFT_BL=14

    ; Touch Controller
    -DTOUCH_CS=33
    -DTOUCH_IRQ=-1

    ; SD card (on SPI)
    -DSDCARD_CS=4
    -DSDCARD_SCK=SPI_SCK_PIN
    -DSDCARD_MISO=SPI_MISO_PIN
    -DSDCARD_MOSI=SPI_MOSI_PIN

    ; NRF24L01+PA
    -DNRF24_CE=13
    -DNRF24_CS=12

    ; CC1101
    -DCC1101_GDO0=45
    -DCC1101_CS=21

    ; Infravermelho (IR)
    -DIR_TX=37
    -DIR_RX=38

    ; GPS
    -DGPS_TX=40
    -DGPS_RX=39   

    ; Joystick KY-023
    -DJOY_VRX=1
    -DJOY_VRY=2
    -DJOY_SW=3

lib_deps = 
    ${env.lib_deps}
    
