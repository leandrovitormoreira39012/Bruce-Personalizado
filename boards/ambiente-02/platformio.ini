[env:ambiente-02]
extends = env
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
; --- CORREÇÃO DO LINKER: Incluindo o src/ ---
build_src_filter = ${env.build_src_filter} +<../src/> +<../boards/ambiente-02/> -<../src/test/> -<../src/tests/> -<../src/examples/>


lib_ignore =
    ESP8266Audio
    ESP8266SAM
    ESP32-audioI2S
    FastLED
   
build_flags =
    ${env.build_flags}
    -Iboards/ambiente-02
    -DDEVICE_NAME="\"Marauder-Full-ST7789-S3\""
    -DBOARD_HAS_PSRAM
   
    -DUSER_SETUP_LOADED=1
    -DSMOOTH_FONT=1
    -DUSING_JOYSTICK=1
    -DGEIST_ROTARY_ENCODER=0

    -DST7789_DRIVER=1
    -DCGRAM_OFFSET=1

    ; SPI (shared) - Pinos seguros (Evitando USB 19)
    -DSCK=12
    -DMOSI=11
    -DMISO=10
    -DSS=5
    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=10
    -DSPI_SS_PIN=5

    ; I2C (Wire)
    -DSDA=8
    -DSCL=9

    ; BadUSB
    -DBAD_RX=44
    -DBAD_TX=43

    ; Display 2.8" ST7789
    -DHAS_SCREEN=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DDTFT_MISO=SPI_MISO_PIN
    -DDTFT_MOSI=SPI_MOSI_PIN
    -DDTFT_SCK=SPI_SCK_PIN
    -DDTFT_CS=17
    -DDTFT_DC=16
    -DDTFT_RST=15
    -DDTFT_BL=14

    ; Touch (Movido do 33 para o 41 - Pino livre)
    -DTOUCH_CS=41
    -DTOUCH_IRQ=-1

    ; SD card
    -DSDCARD_CS=4
    -DSDCARD_SCK=SPI_SCK_PIN
    -DSDCARD_MISO=SPI_MISO_PIN
    -DSDCARD_MOSI=SPI_MOSI_PIN

    ; NRF24L01+PA (CS movido do 12 para o 42 para evitar conflito com SCK)
    -DNRF24_CE=13
    -DNRF24_CS=42

    ; CC1101
    -DCC1101_GDO0=45
    -DCC1101_CS=21

    ; IR
    -DIR_TX=37
    -DIR_RX=38

    ; GPS
    -DGPS_TX=40
    -DGPS_RX=39   

    ; Joystick
    -DJOY_VRX=1
    -DJOY_VRY=2
    -DJOY_SW=3

lib_deps = 
    ${env.lib_deps}
    
