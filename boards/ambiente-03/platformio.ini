[env:ambiente-03]
extends = env
board = esp32dev
board_build.partitions = default_4MB.csv
build_src_filter = ${env.build_src_filter} +<../boards/ambiente-03/>

lib_ignore = 
    ESP8266Audio
    Audio
    arduino-audio-tools

build_flags = 
    ${env.build_flags}
    -Dboards/ambiente-03
    -DDEVICE_NAME="\"Marauder-Mini-Full-ESP32\""

    ; --- Nomes curtos obrigatórios (com o SS de volta) ---
    -DSCK=18
    -DMOSI=23
    -DMISO=19
    -DSS=5
    -DSDA=21
    -DSCL=22

    ; --- Configuração do Display TFT 1.8" (ST7735) ---
    -DHAS_SCREEN=1
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB160x128=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160

    ; --- Pinos da Tela ---
    -DPIN_TFT_CS=15
    -DPIN_TFT_DC=2
    -DPIN_TFT_RST=4
    -DPIN_TFT_BL=32
    
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=PIN_TFT_CS
    -DTFT_DC=PIN_TFT_DC
    -DTFT_RST=PIN_TFT_RST
    -DTFT_BL=PIN_TFT_BL

    ; --- Cartão SD ---
    -DPIN_SD_CS=14
    -DSDCARD_CS=PIN_SD_CS

    ; --- NRF24L01+PA ---
    -DNRF24_CE=25
    -DNRF24_CS=26
    -DNRF24_CE_PIN=25
    -DNRF24_SS_PIN=26

    ; --- CC1101 ---
    -DCC1101_GDO0=27
    -DCC1101_CS=22
    -DCC1101_GDO0_PIN=27
    -DCC1101_SS_PIN=22

    ; --- Infravermelho (IR) ---
    -DIR_TX=33
    -DIR_RX=32
    -DIR_TX_PIN=33
    -DIR_RX_PIN=32

    ; --- GPS ---
    -DGPS_TX=17
    -DGPS_RX=16
    -DSERIAL_TX=17
    -DSERIAL_RX=16
    -DGPS_SERIAL_TX=SERIAL_TX
    -DGPS_SERIAL_RX=SERIAL_RX

    ; --- PN532 (I2C) ---
    -DSYS_I2C_SDA=21
    -DSYS_I2C_SCL=22

    ; --- Joystick KY-023 ---
    -DJOY_VRX=34
    -DJOY_VRY=35
    -DJOY_SW=36
    -DJOY_VRX_PIN=34
    -DJOY_VRY_PIN=35
    -DJOY_SW_PIN=36

lib_deps = 
    ${env.lib_deps}
    
