; Ambiente 02 - ESP32 S3N16R8 + Display 2.8" ST7789V 240x320 (SPI + Touch)
[env:ambiente-02]
extends = env
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ambiente-02>
build_flags =
    ${env.build_flags}
    -Iboards/ambiente-02
    -DDEVICE_NAME='"Ambiente-02 ESP32-S3N16R8 2.8 ST7789"'

    ; SPI
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5

    ; ST7789 240x320 display + Touch controller (touch may be separate SPI)
    -DHAS_SCREEN=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=SPI_MISO_PIN
    -DTFT_MOSI=SPI_MOSI_PIN
    -DTFT_SCK=SPI_SCK_PIN
    -DTFT_CS=17
    -DTFT_DC=16
    -DTFT_RST=15
    -DTFT_BL=14
    -DTOUCH_CS=21        ; touch controller CS (if XPT2046 / separate SPI)

    ; SD card (SPI)
    -DSDCARD_CS=4

    ; NRF24
    -DNRF24_CE_PIN=25
    -DNRF24_SS_PIN=SPI_SS_PIN

    ; CC1101
    -DCC1101_GDO0_PIN=26
    -DCC1101_SS_PIN=22

    ; IR
    -DIR_TX_PIN=27
    -DIR_RX_PIN=33

    ; GPS
    -DSERIAL_TX=1
    -DSERIAL_RX=3
    -DGPS_SERIAL_TX=SERIAL_TX
    -DGPS_SERIAL_RX=SERIAL_RX

    ; PN532 (I2C)
    -DSYS_I2C_SDA=4
    -DSYS_I2C_SCL=5

    ; Joystick
    -DJOY_VRX_PIN=36
    -DJOY_VRY_PIN=37
    -DJOY_SW_PIN=38

lib_deps =
    ${env.lib_deps}
