[env:Marauder-Touch]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/marauder-touch>
build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/marauder-touch
    -D MARAUDER_TOUCH
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_BL=32
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=5
    -D TFT_BACKLIGHT_ON=HIGH
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=25000000
    -D TOUCH_CS=21
    -D HAS_TOUCH=1
    -D SDCARD_CS=12
    -D DEVICE_NAME='"Marauder Touch 2.8"'
    -D SDA=33
    -D SCL=26
    -D SCK=18
    -D MISO=19
    -D MOSI=23
    -D SS=17
lib_deps =
    ${env.lib_deps}
lib_ignore =
    ${env_4mb.lib_ignore}
