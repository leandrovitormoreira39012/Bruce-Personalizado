[env:esp32-s3-st7789-2.8-dola]

; ==============================================
;  SEU FIRMWARE — BRANCH "dola"
;  Tela: ST7789 2.8" 240x320 + Touch XPT2046 + SD
;  ESP32-S3 N16R8 — Pinos confirmados da sua placa
; ==============================================

platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1

    ; ========== TELA PRINCIPAL ST7789 ==========
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DROTATION=0   ; 0=normal, 1=90°, 2=180°, 3=270° — ajusta depois

    ; === Pinos da Tela — CONFIRMADOS ===
    -DTFT_CS=16
    -DTFT_DC=7
    -DTFT_RST=15
    -DTFT_MOSI=6
    -DTFT_SCLK=5
    -DTFT_MISO=8
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH

    ; ========== BRILHO ==========
    -DMINBRIGHT=20
    -DMAXBRIGHT=255

    ; ========== TOUCH XPT2046 ==========
    -DTOUCH_DRIVER=XPT2046
    -DTOUCH_CS=39
    -DTOUCH_SCK=5
    -DTOUCH_MOSI=6
    -DTOUCH_MISO=8
    -DTOUCH_IRQ=40

    ; ========== CARTÃO SD ==========
    -DSD_CS=17

    ; ========== ENCODER + BOTÕES ==========
    -DHAS_ENCODER=1
    -DENCODER_CLK=36
    -DENCODER_DT=37
    -DENCODER_BTN=38
    -DSEL_BTN=38
    -DESC_BTN=21

    ; ========== OUTROS ==========
    -DHAS_SCREEN=1
    -DFP=1
    -DFM=2
    -DFG=3

lib_deps =
    ; Mantém as bibliotecas originais do repositório
    ${common.lib_deps}
