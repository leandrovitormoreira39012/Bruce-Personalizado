; Ambiente 01 - ESP32 S3N16R8 + Display 1.8" 128x160 (SPI serial) + Slot SD + Touch
[env:ambiente-01]
extends = env
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ambiente-01>
build_flags =
    ${env.build_flags}
    -Iboards/ambiente-01
    -DDEVICE_NAME='"Ambiente-01 ESP32-S3N16R8 1.8 TFT"'

    ; SPI (shared)
    -DSCK=18
    -DMOSI=23
    -DMISO=19
    -DSS=5
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5
    
    ; Display 1.8" 128x160
    -DHAS_SCREEN=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MISO=SPI_MISO_PIN
    -DTFT_MOSI=SPI_MOSI_PIN
    -DTFT_SCK=SPI_SCK_PIN
    -DTFT_CS=17
    -DTFT_DC=16
    -DTFT_RST=15
    -DTFT_BL=14

    ; Touch controller (XPT2046 or similar)
    -DTOUCH_CS=33
    -DTOUCH_IRQ=-1

    ; SD card (on SPI) - many small displays include SD slot wired to SPI
    -DSDCARD_CS=4
    -DSDCARD_SCK=SPI_SCK_PIN
    -DSDCARD_MISO=SPI_MISO_PIN
    -DSDCARD_MOSI=SPI_MOSI_PIN

    ; NRF24L01+PA/LNA (SPI)
    -DNRF24_CE_PIN=25
    -DNRF24_SS_PIN=SPI_SS_PIN

    ; CC1101 (SPI)
    -DCC1101_GDO0_PIN=26
    -DCC1101_SS_PIN=21

    ; Infrared (HX-53 tx / HX-M121 rx)
    -DIR_TX_PIN=27
    -DIR_RX_PIN=33

    ; GPS Neo-6M (UART)
    -DSERIAL_TX=1
    -DSERIAL_RX=3
    -DGPS_SERIAL_TX=SERIAL_TX
    -DGPS_SERIAL_RX=SERIAL_RX

    ; PN532 (I2C)
    -DSYS_I2C_SDA=4
    -DSYS_I2C_SCL=5

    ; Joystick KY-023 (ADC + switch)
    -DJOY_VRX_PIN=36
    -DJOY_VRY_PIN=37
    -DJOY_SW_PIN=38

lib_deps =
    ${env.lib_deps}
