[env:Marauder-Mini-ST7735]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/marauder-mini>
build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/marauder-mini
    -D MARAUDER_MINI
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB3
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_BL=32
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=5
    -D TFT_BACKLIGHT_ON=LOW
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=25000000
    -D TOUCH_CS=-1
    -D DEVICE_NAME='"Marauder Mini ST7735"'
lib_deps =
    ${env.lib_deps}
lib_ignore =
    ${env_4mb.lib_ignore}
