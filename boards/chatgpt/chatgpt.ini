[env:chatgpt]

extends = env:esp32-s3-devkitc-1-psram

build_src_filter =
    ${env.build_src_filter}
    +<../boards/chatgpt>

build_flags =
    ${env:esp32-s3-devkitc-1-psram.build_flags}
    -Iboards/chatgpt

    ; ============================================================
    ; CORREÇÃO DO CONFLITO COM FASTLED
    ; ============================================================

    -UFP

    ; ============================================================
    ; TFT ST7789 - 2.8" 240x320
    ; ============================================================

    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13

    -DTFT_CS=10
    -DTFT_DC=16
    -DTFT_RST=17

    ; Inversão de cores necessária para esta tela
    -DTFT_INVERSION_ON=1

    ; Backlight ligado diretamente ao 3V3
    -DTFT_BL=-1
    -DBACKLIGHT=-1

    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28

    ; ============================================================
    ; TOUCH XPT2046
    ; ============================================================

    -DTOUCH_CS=9

    ; ============================================================
    ; SPI PRINCIPAL
    ; ============================================================

    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10

    ; ============================================================
    ; SD CARD
    ; ============================================================

    -DSDCARD_CS=8
    -DSDCARD_SCK=12
    -DSDCARD_MISO=13
    -DSDCARD_MOSI=11

    ; ============================================================
    ; NRF24L01 + PA/LNA
    ; ============================================================

    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=4
    -DNRF24_SS_PIN=5
    -DNRF24_MOSI_PIN=11
    -DNRF24_SCK_PIN=12
    -DNRF24_MISO_PIN=13

    ; ============================================================
    ; CC1101
    ; ============================================================

    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=6
    -DCC1101_SS_PIN=7
    -DCC1101_MOSI_PIN=11
    -DCC1101_SCK_PIN=12
    -DCC1101_MISO_PIN=13

    ; ============================================================
    ; PN532 - SPI
    ; ============================================================

    -DPN532_SS_PIN=18

    ; ============================================================
    ; OLED 0.93" 128x32 - I2C
    ; ============================================================

    -DSDA_PIN=39
    -DSCL_PIN=38

    ; ============================================================
    ; JY050
    ; COM -> GND
    ; Entradas ativas em LOW
    ; ============================================================

    -DJY050_UP_PIN=14
    -DJY050_DOWN_PIN=15
    -DJY050_LEFT_PIN=21
    -DJY050_RIGHT_PIN=40
    -DJY050_MTD_PIN=41
    -DJY050_SET_PIN=42
    -DJY050_B1_PIN=47
    -DJY050_B2_PIN=48

    ; RST do JY050 -> EN da ESP32-S3

    ; ============================================================
    ; IDENTIFICAÇÃO
    ; ============================================================

    -DDEVICE_NAME='"Bruce ChatGPT"'

lib_deps =
    ${env.lib_deps}
