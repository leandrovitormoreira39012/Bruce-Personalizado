[env:chatgpt]

extends = env:esp32-s3-devkitc-1-psram

build_src_filter =
    ${env.build_src_filter}
    +<../boards/chatgpt>

build_flags =
    ${env.build_flags}
    -Iboards/chatgpt

    ; ============================================================
    ; TFT ST7789 240x320
    ; ============================================================

    -DST7789_DRIVER=1

    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13

    -DTFT_CS=10
    -DTFT_DC=16
    -DTFT_RST=17

    -DTOUCH_CS=9

    -DROTATION=0

    -DBACKLIGHT=-1

    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28

    ; ============================================================
    ; SPI
    ; ============================================================

    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10

    ; ============================================================
    ; Identificação
    ; ============================================================

    -DDEVICE_NAME='"Bruce ChatGPT"'

lib_deps =
    ${env.lib_deps}
