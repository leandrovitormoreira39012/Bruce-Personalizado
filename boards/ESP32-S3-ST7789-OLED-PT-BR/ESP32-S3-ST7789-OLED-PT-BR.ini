; PlatformIO Project Configuration File
; ESP32-S3 N16R8 com ST7789 240x320 + OLED 0.93" secundária
; PN532 + NRF24 + CC1101 + GPS + IR + Joystick + Encoder
; Interface em Português (Brasil)

[env:ESP32-S3-ST7789-OLED-PT-BR]
board = esp32-s3-devkitc-1
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ESP32-S3-ST7789-OLED-PT-BR>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-S3-ST7789-OLED-PT-BR
	-DBOARD_NAME=\"ESP32-S3-ST7789-OLED-PT-BR\"
	-DLANGUAGE_PT_BR=1
	-DHAS_OLED_SECONDARY=1
	-DOLED_SECONDARY_WIDTH=128
	-DOLED_SECONDARY_HEIGHT=32
	-DHAS_ENCODER_JY050=1
	-DENCODER_CLK=12
	-DENCODER_DT=13
	-DENCODER_SW=14
	-DENCODER_UP=20
	-DENCODER_DOWN=19
	-DHAS_JOYSTICK=1
	-DJOYSTICK_X=3
	-DJOYSTICK_Y=9
	-DHAS_TOUCH=1
	-DHAS_SDCARD=1
	-DHAS_SCREEN=1
	-DROTATION=1
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=1
	-DTFT_BL=4
	-DTFT_RST=15
	-DTFT_DC=7
	-DTFT_MOSI=6
	-DTFT_SCLK=5
	-DTFT_CS=16
	-DTOUCH_CS=11
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DSDCARD_CS=40
	-DSDCARD_SCK=5
	-DSDCARD_MISO=41
	-DSDCARD_MOSI=6
	-DGROVE_SDA=18
	-DGROVE_SCL=8
	-DOLED_ADDRESS=0x3C
	-DUSE_PN532=1
	-DUSE_NRF24_VIA_SPI=1
	-DNRF24_CE_PIN=21
	-DNRF24_SS_PIN=47
	-DUSE_CC1101_VIA_SPI=1
	-DCC1101_GDO0_PIN=35
	-DCC1101_SS_PIN=47
	-DMINBRIGHT=160

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SSD1306@^2.5.9
	adafruit/Adafruit BusIO@^1.14.1
