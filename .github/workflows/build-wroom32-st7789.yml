name: Build ESP32-WROOM32 ST7789

on:
  push:
    branches: [ "Bruce-1.17" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio

      - name: Build esp-wroom32-st7789
        run: pio run -e esp-wroom32-st7789

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruce-esp32-wroom32-st7789
          path: .pio/build/esp-wroom32-st7789/*.bin
          
