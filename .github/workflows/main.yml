name: Build Bruce ChatGPT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compilar ambiente ChatGPT
        run: |
          pio run -e chatgpt

      - name: Publicar firmware
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-ChatGPT
          path: |
            .pio/build/chatgpt/firmware.bin
            .pio/build/chatgpt/firmware.factory.bin
            .pio/build/chatgpt/bootloader.bin
            .pio/build/chatgpt/partitions.bin
          if-no-files-found: warn
